dbt_cg:
  target: dev
  outputs:
    dev:
      type: postgres
      host: 127.0.0.1
      port: 5434
      user: "{{ env_var('POSTGRES_USER', 'dbt_user') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'changeme') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dbt_dev') }}"
      schema: public
      threads: 4

    # Cible prod (docs/GOUVERNANCE.md). Projet GCP bv-dataplatform, BigQuery
    # + RLS + Policy Tags actifs sur fct_ecarts_reel_budget (Sprint 6).
    # BQ_KEYFILE (pas GOOGLE_APPLICATION_CREDENTIALS) : ce nom standard peut
    # être déjà positionné de façon persistante sur la machine pour un autre
    # projet GCP et écraserait silencieusement cette valeur.
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('BQ_PROJECT', '') }}"
      dataset: "{{ env_var('BQ_DATASET', '') }}"
      keyfile: "{{ env_var('BQ_KEYFILE', '') }}"
      threads: 4
