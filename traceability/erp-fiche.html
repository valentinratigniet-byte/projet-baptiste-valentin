<style>
  :root {
    --bg: #0b3d2e;
    --panel: #f2efe4;
    --ink: #1a1a1a;
    --border: #8a8365;
    --accent: #0b3d2e;
    --danger: #7a1f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Consolas", "Courier New", monospace;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
  }
  .banner {
    background: var(--danger);
    color: #fff;
    padding: 10px 16px;
    font-weight: bold;
    text-align: center;
    border-radius: 4px;
    margin-bottom: 16px;
  }
  .frame {
    background: var(--panel);
    border: 3px double var(--border);
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 24px 24px;
  }
  .titlebar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .titlebar h1 { font-size: 15px; margin: 0; letter-spacing: 1px; }
  .titlebar span { font-size: 11px; opacity: .7; }
  form.search { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    background: #fff;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { opacity: .85; }
  table.results { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
  table.results th, table.results td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; }
  table.results th { background: #e4dfc9; }
  table.results tr { cursor: pointer; }
  table.results tr:hover { background: #e9e5d3; }
  .fiche-fields { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; font-size: 13px; }
  .fiche-fields dt { font-weight: bold; opacity: .75; }
  .fiche-fields dd { margin: 0; }
  .empty { font-size: 13px; opacity: .7; font-style: italic; }
  .back { margin-top: 16px; }
  .back a { color: var(--accent); font-size: 12px; }
</style>
</head>

  // ERP-ROWS:END

  const FIELD_LABELS = {
    CDSOC: "Société",
    NUMPCE: "N° pièce",
    CDCLI: "Code client",
    RSCLI: "Raison sociale",
    CDCC: "Centre de coût (legacy)",
    CDCPT: "Compte comptable",
    DTPCE: "Date pièce",
    QTE: "Quantité",
    MTHT: "Montant HT",
    MTTVA: "Montant TVA",
    MTTTC: "Montant TTC",
    FLGANO: "FLGANO (non documenté à l'origine)",
  };

  function params() {
    return new URLSearchParams(window.location.search);
  }

  function renderFiche(row) {
    const fiche = document.getElementById("fiche");
    fiche.innerHTML = "";
    const dl = document.createElement("dl");
    dl.className = "fiche-fields";
    for (const key of Object.keys(FIELD_LABELS)) {
      const dt = document.createElement("dt");
      dt.textContent = FIELD_LABELS[key];
      const dd = document.createElement("dd");
      dd.textContent = row[key] || "—";
      dl.append(dt, dd);
    }
    fiche.appendChild(dl);
  }

  function renderResults(rows, query) {
    const results = document.getElementById("results");
    const fiche = document.getElementById("fiche");
    results.innerHTML = "";
    fiche.innerHTML = "";

    if (!rows.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = query ? "Aucune pièce trouvée pour « " + query + " »." : "Aucune donnée chargée (export vide).";
      results.appendChild(p);
      return;
    }

    if (rows.length === 1) {
      renderFiche(rows[0]);
      return;
    }

    const table = document.createElement("table");
    table.className = "results";
    const thead = document.createElement("tr");
    for (const h of ["NUMPCE", "CDCLI", "RSCLI", "DTPCE", "MTHT"]) {
      const th = document.createElement("th");
      th.textContent = h;
      thead.appendChild(th);
    }
    table.appendChild(thead);
    for (const row of rows.slice(0, 50)) {
      const tr = document.createElement("tr");
      for (const h of ["NUMPCE", "CDCLI", "RSCLI", "DTPCE", "MTHT"]) {
        const td = document.createElement("td");
        td.textContent = row[h] || "";
        tr.appendChild(td);
      }
      tr.addEventListener("click", () => renderFiche(row));
      table.appendChild(tr);
    }
    results.appendChild(table);
    if (rows.length > 50) {
      const note = document.createElement("p");
      note.className = "empty";
      note.textContent = rows.length + " résultats — 50 premiers affichés, affinez la recherche.";
      results.appendChild(note);
    }
  }

  function search(query) {
    const q = (query || "").trim().toUpperCase();
    if (!q) {
      renderResults(ERP_ROWS, "");
      return;
    }
    const rows = ERP_ROWS.filter(
      (r) => (r.NUMPCE || "").toUpperCase().includes(q) || (r.CDCLI || "").toUpperCase().includes(q)
    );
    renderResults(rows, query);
  }

  document.getElementById("table-label").textContent = params().get("table") || "";
  document.getElementById("search-form").addEventListener("submit", (e) => {
    e.preventDefault();
    search(document.getElementById("search-input").value);
  });

  const initialNumpce = params().get("numpce");
  if (initialNumpce) {
    document.getElementById("search-input").value = initialNumpce;
    search(initialNumpce);
  } else {
    renderResults(ERP_ROWS, "");
  }
</script>
